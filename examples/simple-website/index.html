<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PushNotify Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 600px;
            width: 100%;
            padding: 40px;
        }

        h1 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 32px;
        }

        p {
            color: #666;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .status {
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-weight: 500;
        }

        .status.subscribed {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status.not-subscribed {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .status.permission-denied {
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeaa7;
        }

        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-right: 10px;
            margin-bottom: 10px;
        }

        button:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        button.secondary {
            background: #6c757d;
        }

        button.secondary:hover {
            background: #5a6268;
        }

        .log {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
            max-height: 300px;
            overflow-y: auto;
        }

        .log-entry {
            padding: 8px 0;
            border-bottom: 1px solid #dee2e6;
            font-size: 14px;
            font-family: 'Courier New', monospace;
        }

        .log-entry:last-child {
            border-bottom: none;
        }

        .log-entry .timestamp {
            color: #6c757d;
            margin-right: 10px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 5px;
            color: #495057;
            font-weight: 500;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ced4da;
            border-radius: 8px;
            font-size: 14px;
        }

        .config-display {
            background: #e9ecef;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>PushNotify Demo</h1>
        <p>Test push notifications integration with your website</p>

        <div id="status" class="status not-subscribed">
            Not subscribed to notifications
        </div>

        <div class="input-group">
            <label for="apiKey">API Key</label>
            <input type="text" id="apiKey" placeholder="Enter your API key from the dashboard">
        </div>

        <div class="input-group">
            <label for="apiUrl">API URL</label>
            <input type="text" id="apiUrl" value="http://localhost:3001" placeholder="http://localhost:3001">
        </div>

        <button id="initBtn">Initialize SDK</button>
        <button id="subscribeBtn" disabled>Subscribe</button>
        <button id="unsubscribeBtn" class="secondary" disabled>Unsubscribe</button>
        <button id="checkBtn" class="secondary">Check Status</button>

        <div class="log">
            <div id="logEntries"></div>
        </div>
    </div>

    <script src="http://localhost:3001/sdk/pushnotify.js"></script>
    <script>
        let pushNotify = null;
        const logEntries = document.getElementById('logEntries');
        const statusDiv = document.getElementById('status');

        function addLog(message) {
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            const timestamp = new Date().toLocaleTimeString();
            entry.innerHTML = `<span class="timestamp">[${timestamp}]</span>${message}`;
            logEntries.insertBefore(entry, logEntries.firstChild);
        }

        function updateStatus(subscribed) {
            if (subscribed) {
                statusDiv.className = 'status subscribed';
                statusDiv.textContent = 'Subscribed to notifications';
                document.getElementById('subscribeBtn').disabled = true;
                document.getElementById('unsubscribeBtn').disabled = false;
            } else {
                const permission = Notification.permission;
                if (permission === 'denied') {
                    statusDiv.className = 'status permission-denied';
                    statusDiv.textContent = 'Notifications blocked - Please enable in browser settings';
                } else {
                    statusDiv.className = 'status not-subscribed';
                    statusDiv.textContent = 'Not subscribed to notifications';
                }
                document.getElementById('subscribeBtn').disabled = false;
                document.getElementById('unsubscribeBtn').disabled = true;
            }
        }

        document.getElementById('initBtn').addEventListener('click', async () => {
            const apiKey = document.getElementById('apiKey').value.trim();
            const apiUrl = document.getElementById('apiUrl').value.trim();

            if (!apiKey) {
                alert('Please enter your API key');
                return;
            }

            try {
                addLog('Initializing PushNotify SDK...');

                pushNotify = new PushNotify({
                    apiKey: apiKey,
                    apiUrl: apiUrl,
                    debug: true,
                    onSubscribe: (subscriptionId) => {
                        addLog(`Subscribed! ID: ${subscriptionId}`);
                        updateStatus(true);
                    },
                    onUnsubscribe: () => {
                        addLog('Unsubscribed successfully');
                        updateStatus(false);
                    }
                });

                await pushNotify.init();

                addLog('SDK initialized successfully!');
                document.getElementById('subscribeBtn').disabled = false;
                document.getElementById('initBtn').disabled = true;

                // Check if already subscribed
                const isSubscribed = await pushNotify.isSubscribed();
                updateStatus(isSubscribed);

            } catch (error) {
                addLog(`Error: ${error.message}`);
                console.error(error);
            }
        });

        document.getElementById('subscribeBtn').addEventListener('click', async () => {
            if (!pushNotify) {
                alert('Please initialize the SDK first');
                return;
            }

            try {
                addLog('Requesting notification permission...');
                await pushNotify.subscribe();
                addLog('Subscription successful!');
            } catch (error) {
                addLog(`Error: ${error.message}`);
                console.error(error);
            }
        });

        document.getElementById('unsubscribeBtn').addEventListener('click', async () => {
            if (!pushNotify) {
                alert('Please initialize the SDK first');
                return;
            }

            try {
                addLog('Unsubscribing...');
                await pushNotify.unsubscribe();
                addLog('Unsubscribed successfully!');
            } catch (error) {
                addLog(`Error: ${error.message}`);
                console.error(error);
            }
        });

        document.getElementById('checkBtn').addEventListener('click', async () => {
            if (!pushNotify) {
                alert('Please initialize the SDK first');
                return;
            }

            try {
                const isSubscribed = await pushNotify.isSubscribed();
                const permission = pushNotify.getPermission();
                addLog(`Subscription status: ${isSubscribed ? 'Subscribed' : 'Not subscribed'}`);
                addLog(`Permission: ${permission}`);
                updateStatus(isSubscribed);
            } catch (error) {
                addLog(`Error: ${error.message}`);
                console.error(error);
            }
        });

        // Initial log
        addLog('Welcome to PushNotify Demo! Enter your API key and click Initialize to start.');
    </script>
</body>
</html>
